# Drop LiDAR returns that come from the robot itself.
#
# The C1 sits at base_link x=0.237, z=0.165, yawed 180 degrees (see the
# laser_joint rpy in the URDF), so a bearing of ~6 deg in the laser frame is
# actually behind the robot. The antenna at the back lands at roughly
# base_link x=0.065, y=-0.018 -- squarely inside the footprint -- and shows up
# as a fixed 0.173 m return with a standard deviation of 1.3 mm.
#
# Left alone it is a permanent obstacle that moves with the robot: the
# collision monitor sees a hit right against the body and scales the velocity
# to zero, and MOLA gets a "landmark" that never moves relative to the chassis.
#
# The polygon is the URDF footprint with a small margin, matching the one in
# nav2_params.yaml.

scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: self_filter
      type: laser_filters/LaserScanPolygonFilter
      params:
        polygon_frame: base_link
        polygon: '[[-0.09, -0.185], [0.38, -0.185], [0.38, 0.185], [-0.09, 0.185]]'
        invert: false

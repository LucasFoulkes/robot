joy_axis_mapper:
  ros__parameters:
    axis: 0
    deadman_button: 9
    deadzone: 0.0
    invert: false
    scale: 0.6
    output_topic: "/actuators/steering/command"

joy_axis_mapper_throttle:
  ros__parameters:
    axis: 3
    deadman_button: 9
    deadzone: 0.0
    invert: true
    scale: 1.0
    output_topic: "/actuators/throttle/command"

pico_ackermann_driver:
  ros__parameters:
    channels: ["steering", "throttle"]
    port: "/dev/pico-ackermann"
    baud: 115200
    command_limit: 1.0
    send_hz: 50.0
    input_timeout: 0.25
